[project]
name = "syncle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "black>=26.5.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "openai>=3.20.0",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.1",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
]

[tool.mypy]
strict = true
show_error_codes = true
exclude = [".venv", "migrations"]
disable_error_code = ["import-untyped"]
