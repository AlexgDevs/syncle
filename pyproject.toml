[project]
name = "syncle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
]

[tool.mypy]
strict = true
show_error_codes = true
exclude = [".venv", "migrations"]
disable_error_code = ["import-untyped"]
