# Redis configuration for Syncle (plan A memory guard).
#
# The stash and job keys always carry a TTL, so volatile-ttl evicts the
# oldest expiring key under pressure instead of letting the container OOM.
# Keys without TTL (e.g. the active-jobs set) are never evicted.
#
# Local run (portable Redis):
#   redis-server.exe config/redis.conf
# Apply to an already running instance:
#   redis-cli config set maxmemory 512mb
#   redis-cli config set maxmemory-policy volatile-ttl

maxmemory 512mb
maxmemory-policy volatile-ttl
